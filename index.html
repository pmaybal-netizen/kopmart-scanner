<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KOPMART Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f8d7e8;
      text-align: center;
    }

    .header {
      background: #800020;
      color: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .instruction {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      color: #555;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 15px;
      padding: 10px;
      box-sizing: border-box;
    }

    .barcode {
      margin-top: 15px;
      background: white;
      padding: 15px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #800020;
      word-break: break-all;
    }

    .success {
      color: green;
    }

    button {
      margin-top: 15px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #800020;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🛒 KOPMART</h1>
    <p style="color:white;">Barcode Scanner</p>
  </div>

  <div class="instruction">
    📱 Hold your iPhone about <b>15–25 cm</b> from the barcode.<br>
    Keep the barcode straight and well lit.
  </div>

  <div id="reader"></div>

  <div class="barcode">
    Barcode:
    <span id="result">Scanning...</span>
  </div>

  <button onclick="closeScanner()">Close Scanner</button>

<script>

let scanner = null;
let alreadyScanned = false;

function onScanSuccess(decodedText, decodedResult) {

  if (alreadyScanned) {
    return;
  }

  alreadyScanned = true;

  document.getElementById("result").innerHTML =
    '<span class="success">✓ ' + decodedText + '</span>';

  if (window.opener && !window.opener.closed) {

    window.opener.postMessage(
      {
        type: "KOPMART_BARCODE",
        barcode: decodedText
      },
      "*"
    );

    setTimeout(function() {
      window.close();
    }, 1000);
  }
}

function onScanFailure(error) {
  // Continue scanning
}

function startScanner() {

  scanner = new Html5Qrcode("reader");

  const config = {

    fps: 15,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      let width = Math.floor(viewfinderWidth * 0.85);
      let height = Math.floor(viewfinderHeight * 0.35);

      return {
        width: width,
        height: height
      };
    },

    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    }

  };

  scanner.start(
    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  ).catch(function(error) {

    document.getElementById("result").innerText =
      "Camera error: " + error;

    console.log(error);

  });
}

function closeScanner() {

  if (scanner) {

    scanner.stop()
      .then(function() {
        window.close();
      })
      .catch(function() {
        window.close();
      });

  } else {

    window.close();

  }
}

window.onload = function() {
  startScanner();
};

</script>

</body>
</html>
